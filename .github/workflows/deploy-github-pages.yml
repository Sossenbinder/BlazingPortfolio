name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Generate static site
        run: dotnet run --project BlazingPortfolio/BlazingPortfolio.csproj --configuration Release

      - name: Add CNAME for custom domain
        run: echo 'dotschranz.net' > BlazingPortfolio/output/CNAME

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: BlazingPortfolio/output
