name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Generate static site
        run: dotnet run --project BlazingPortfolio/BlazingPortfolio.csproj --configuration Release --no-launch-profile
        env:
          ASPNETCORE_ENVIRONMENT: Production

      - name: Add CNAME for custom domain
        run: echo 'dotschranz.net' > BlazingPortfolio/output/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: BlazingPortfolio/output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
