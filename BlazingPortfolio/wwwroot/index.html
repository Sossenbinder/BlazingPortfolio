<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DotSchranz</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="/resources/favicon.ico">
    <link href="css/site.css" rel="stylesheet">
    <link href="BlazingPortfolio.styles.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1a5QjYCtda5Ut1w7Z8+i2CloFdzr+Yo" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

    <style>
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #e8f1f0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(232, 241, 240, 0.3);
            border-top-color: #e8f1f0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
